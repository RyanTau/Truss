services:
  truss-engine:
    build:
      context: ./truss_engine
    container_name: truss-engine
    restart: unless-stopped
    ports:
      - "10350:10350"
    environment:
      # Optional: set this in .env to choose your own persistent token.
      # Otherwise the engine creates one on first start and prints it once.
      TRUSS_API_TOKEN: ${TRUSS_API_TOKEN:-}
    volumes:
      # Keeps downloaded models when the container is recreated.
      - truss-models:/data

volumes:
  truss-models:
