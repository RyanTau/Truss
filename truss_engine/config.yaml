name: Truss Local Engine
version: "0.1.11"
slug: truss_engine
description: Streaming speech recognition with local Laya or hosted Jev decisions
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant: "2026.1.0"
ports:
  10350/tcp: 10350
ports_description:
  10350/tcp: Authenticated Truss streaming API
options:
  api_token: ""
  bundled_stt: true
  stt_backend: sherpa
  nemotron_url: http://127.0.0.1:10351
  nemotron_token: ""
  threads: 4
  device: cpu
  laya_model_path: ""
  decision_backend: laya
  typesafe_api_key: ""
  jev_model: jev-latest
schema:
  api_token: password
  bundled_stt: bool
  stt_backend: list(sherpa|nemotron)
  nemotron_url: str
  nemotron_token: password
  threads: int(1,16)
  device: list(cpu)
  laya_model_path: str?
  decision_backend: list(laya|jev)
  typesafe_api_key: password
  jev_model: str
url: https://github.com/RyanTau/Truss
